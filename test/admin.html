<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Hyo-seung Shin</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./styles.css?v=2026-10-15f">
</head>
<body class="site">

<header class="topnav">
  <div class="wrap topnav-in">
    <a class="logo" href="./index.html">Hyo-seung Shin</a>
    <div class="nav-acts">
      <a class="pill sm" href="./index.html">← Home</a>
      <button class="pill sm" data-theme-btn>Dark</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="gate">
    <span class="eyebrow">Admin</span>
    <h1>관리자 확인</h1>
    <p class="gate-desc">사이트 내용을 편집하려면 관리자 비밀번호를 입력하세요.</p>
    <form id="gateForm" autocomplete="off">
      <label class="fld">
        <span class="fld-l">비밀번호</span>
        <input id="gatePw" type="password" required autofocus>
      </label>
      <button class="pill ink wide" type="submit">편집 페이지로 이동</button>
      <p id="gateMsg" class="gate-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<script src="./app.js?v=2026-10-15f"></script>
<script src="./admin.js?v=2026-10-15f"></script>
<script>
APP.initTheme();
ADMIN.initGate();
</script>
</body>
</html>
