<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Hyo-seung Shin</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./styles.css?v=2026-10-29">
</head>
<body class="site">

<header class="topnav">
  <div class="wrap topnav-in">
    <a class="logo" href="./index.html">Hyo-seung Shin</a>
    <div class="nav-acts">
      <a class="pill sm" href="./index.html">← Home</a>
      <button class="theme-sw" type="button" data-theme-btn role="switch" aria-checked="false" aria-label="다크 모드">
        <span class="ts-knob" aria-hidden="true"></span>
        <svg class="ts-ic ts-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="ts-ic ts-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/><path class="ts-star" d="M17 3.2v2.6M15.7 4.5h2.6M20.6 7.6v1.8M19.7 8.5h1.8"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="gate">
    <span class="eyebrow">Admin</span>
    <h1>관리자 확인</h1>
    <p class="gate-desc">사이트 내용을 편집하려면 관리자 비밀번호를 입력하세요.</p>
    <form id="gateForm" autocomplete="off">
      <label class="fld">
        <span class="fld-l">비밀번호</span>
        <input id="gatePw" type="password" required autofocus>
      </label>
      <button class="pill ink wide" type="submit">편집 페이지로 이동</button>
      <p id="gateMsg" class="gate-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<script src="./app.js?v=2026-10-29"></script>
<script src="./admin.js?v=2026-10-29"></script>
<script>
APP.initTheme();
ADMIN.initGate();
</script>
</body>
</html>
